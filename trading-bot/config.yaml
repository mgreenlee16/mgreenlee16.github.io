# ---------------------------------------------------------------
# 15-minute Opening Range Breakout (ORB) settings
# Defaults follow the "base strategy" from the ORB videos:
#   range = 9:30-9:45 high/low (wicks included)
#   enter long at the open of the next candle after a 15-min candle CLOSES above the range
#   stop = bottom of the range, target = 1.5x the risk, long only
# Every rule lives here, so you can change how the bot trades without
# touching the code. Times are US/Eastern (New York).
# ---------------------------------------------------------------

# What to trade. The videos trade the S&P 500 (SPY) and Nasdaq 100 (QQQ).
# You can add liquid stocks, e.g. [SPY, QQQ, AAPL, NVDA], but backtest them first.
symbols: [SPY, QQQ]

# --- The opening range ---
opening_range_minutes: 15        # 9:30-9:45 high/low becomes the range

# --- Entry ---
# Size of the candle that has to CLOSE outside the range to trigger an entry
# (this is the "chart timeframe" from the videos).
# 15 = video default. 5 and 1 enter earlier; in the timeframe video they
# worked best with bigger targets (5-min -> 2.0R, 1-min -> 2.5R).
signal_timeframe_minutes: 15
# long = video default (shorts lost money in the 5-year S&P 500 test).
direction: long                  # both | long | short
# Not specified in the videos. Max's rule of thumb: if price stays inside the
# range for 6-7 fifteen-minute candles, it's a choppy day, so stop looking.
last_entry_time: "11:30"

# Skip the day if the opening range is too tight or too wide, as a % of price
# (the min/max range filter mentioned in the timeframe video).
# 0 / 100 turns the filter off. Example to try: 0.2 / 1.0
min_range_pct: 0.0
max_range_pct: 100.0

# Trend filter (from the "most traders lose with ORB" video): only take longs
# when yesterday's close is above its N-day average, and only shorts when below.
# 0 = off. Try 20 or 50 and compare backtests with it on vs off.
trend_filter_days: 0

# --- Exit ---
# Where the stop loss goes:
#   opposite = other side of the range (long: range low; short: range high)
#   midpoint = middle of the range
#   candle   = low (long) / high (short) of the breakout candle
stop_mode: opposite
reward_risk: 1.5                 # profit target = 1.5x the risk
flatten_time: "15:55"            # close everything before the bell

# --- Risk management ---
risk_per_trade_pct: 1.0          # lose at most 1% of the account if stopped out
# SPY/QQQ ranges are small (often ~0.5%), so risking 1% needs a big position.
# 100 = up to the full account value per trade (Alpaca allows up to 4x intraday).
max_position_pct: 100.0          # cap on one position, as % of the account
max_trades_per_day: 2            # across all symbols (one trade per symbol per day)
daily_loss_limit_pct: 3.0        # stop opening trades after losing 3% in a day

# --- Data ---
# iex = free real-time feed (fine for paper trading).
# sip = full-market feed; on the free plan it works for backtests (older data).
live_data_feed: iex
backtest_data_feed: sip

# --- Backtest only ---
starting_equity: 100000
slippage_pct: 0.02               # 0.02% worse fill on every entry and exit
